name: Deploy brand portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate integrations and accessibility
        run: npm test

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inject and verify Academy global shell on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          loader = '<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.2" data-skunkworks-global-shell="2026.08.15.2"></script>'
          pages = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              if 'academy-navigation.js' not in html and 'data-skunkworks-global-shell' not in html:
                  if '</head>' in html:
                      html = html.replace('</head>', f'  {loader}\n</head>', 1)
                  elif '</body>' in html:
                      html = html.replace('</body>', f'  {loader}\n</body>', 1)
                  else:
                      raise SystemExit(f'Cannot inject global shell into {path}: no closing head/body tag')
                  path.write_text(html, encoding='utf-8')
              pages.append(path)
          missing = [str(path) for path in pages if 'academy-navigation.js' not in path.read_text(encoding='utf-8', errors='ignore') and 'data-skunkworks-global-shell' not in path.read_text(encoding='utf-8', errors='ignore')]
          if missing:
              raise SystemExit('Missing Academy global shell: ' + ', '.join(missing))
          print(f'Verified Academy global shell on {len(pages)} HTML page(s).')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
